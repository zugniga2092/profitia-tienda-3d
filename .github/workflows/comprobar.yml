name: Comprobar la tienda

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Revisar dependencias (vulnerabilidades)
        run: npm audit --omit=dev --audit-level=high

      - name: Comprobar configuración, fotos, APIs y que no haya claves en el código
        run: npm run check

      - name: Buscar secretos en todo el historial (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
